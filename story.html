<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090909" />
  <title>Our Story in Photos | Katie &amp; Joseph</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-soft: #12110f;
      --bg-deep: #090909;
      --gold: #d4af6a;
      --gold-soft: #f7e3a3;
      --text: #f8f2e7;
      --muted: #e6d7a8;
      --border: rgba(212, 175, 106, 0.34);
      --panel: rgba(18, 17, 15, 0.82);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg-deep);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem 1rem 4rem;
      background:
        radial-gradient(ellipse at 50% 0, rgba(212, 175, 106, 0.13), transparent 34rem),
        linear-gradient(180deg, var(--bg-soft), var(--bg-deep) 46rem);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      width: min(100%, 70rem);
      margin: 0 auto;
    }

    .topbar a {
      color: var(--gold-soft);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(212, 175, 106, 0.5);
    }

    .page-header {
      padding: clamp(2.5rem, 7vw, 5rem) 1rem 3.5rem;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 0.7rem;
      color: var(--gold-soft);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--gold-soft);
      font-size: clamp(2.4rem, 7vw, 4.5rem);
      font-weight: 400;
      line-height: 1.08;
      text-shadow: 0 0 20px rgba(212, 175, 106, 0.14);
    }

    .intro {
      margin: 1rem auto 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .timeline {
      position: relative;
      display: grid;
      gap: 2rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .timeline::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: linear-gradient(180deg, transparent, var(--gold), var(--gold), transparent);
      content: "";
      transform: translateX(-50%);
    }

    .timeline-item {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 3rem minmax(0, 1fr);
      align-items: center;
    }

    .timeline-item::before {
      z-index: 1;
      grid-column: 2;
      grid-row: 1;
      justify-self: center;
      width: 0.7rem;
      height: 0.7rem;
      border: 1px solid var(--gold-soft);
      border-radius: 50%;
      background: var(--bg-deep);
      box-shadow: 0 0 0 4px rgba(212, 175, 106, 0.1);
      content: "";
    }

    .timeline-item figure {
      grid-column: 1;
      grid-row: 1;
      width: min(100%, 29rem);
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 1rem;
      background: var(--panel);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.22);
    }

    .timeline-item:nth-child(even) figure {
      grid-column: 3;
      justify-self: end;
    }

    .timeline-item img {
      display: block;
      width: 100%;
      height: auto;
      background: #0a0a0a;
    }

    figcaption {
      padding: 0.95rem 1.1rem 1.05rem;
      color: var(--gold-soft);
      font-size: 1rem;
      letter-spacing: 0.04em;
      text-align: center;
    }

    .photo-caption {
      display: block;
      margin-top: 0.4rem;
      color: var(--muted);
      font-size: 0.92rem;
      letter-spacing: normal;
      line-height: 1.55;
      white-space: pre-line;
    }

    @media (max-width: 640px) {
      body {
        padding: 1rem 0.85rem 3rem;
      }

      .page-header {
        padding: 2.5rem 0.25rem 2rem;
      }

      .timeline {
        gap: 1.25rem;
        padding-left: 1.25rem;
      }

      .timeline::before {
        left: 0.35rem;
        transform: none;
      }

      .timeline-item {
        display: block;
        padding-left: 0.75rem;
      }

      .timeline-item::before {
        position: absolute;
        top: 1.25rem;
        left: -1.25rem;
      }

      .timeline-item figure,
      .timeline-item:nth-child(even) figure {
        width: 100%;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>
