<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katie & Joseph's Wedding</title>
  <style>
    :root {
      --bg-soft: #12110f;
      --bg-deep: #090909;
      --panel: rgba(255, 255, 255, 0.03);
      --gold: #d4af6a;
      --gold-soft: #f7e3a3;
      --gold-deep: #b98c2d;
      --text: #f8f2e7;
      --muted: #e6d7a8;
      --shadow: rgba(212, 175, 106, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(212, 175, 106, 0.14), transparent 35%),
        linear-gradient(180deg, var(--bg-soft) 0%, var(--bg-deep) 100%);
      color: var(--text);
      font-family: "Georgia", "Times New Roman", serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
      letter-spacing: 0.04em;
    }

    .hero {
      width: min(100%, 76rem);
      min-height: min(82vh, 48rem);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      border: 1px solid rgba(212, 175, 106, 0.5);
      border-radius: 1.5rem;
      overflow: hidden;
      background: #0d0d0d;
      box-shadow: 0 0 0 1px rgba(212, 175, 106, 0.1), 0 0 38px var(--shadow);
      padding-left: clamp(1.25rem, 4vw, 4rem);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("assets/PXL_20260306_104440753.MP~2.jpg");
      background-size: cover;
      background-position: 60% center;
      transform: scale(1.04);
      filter: saturate(0.8) brightness(0.52);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(8, 8, 8, 0.82) 0%, rgba(8, 8, 8, 0.32) 40%, rgba(8, 8, 8, 0.52) 100%);
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 34rem);
      padding: 2.5rem 1.75rem;
      border: 1px solid rgba(212, 175, 106, 0.35);
      border-radius: 1.25rem;
      background: rgba(18, 17, 15, 0.26);
      backdrop-filter: blur(2px);
      text-align: left;
    }

    .eyebrow {
      margin: 0 0 0.75rem;
      color: var(--gold-soft);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      line-height: 1.1;
      color: var(--gold-soft);
      text-shadow: 0 0 16px rgba(212, 175, 106, 0.2);
    }

    p {
      margin: 1.25rem auto 0;
      max-width: 32rem;
      color: var(--muted);
      font-size: 1.12rem;
      line-height: 1.7;
    }

    strong {
      color: var(--gold-soft);
      font-weight: 700;
    }

    .button {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.9rem 1.8rem;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
      color: #1d1409;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 10px 22px rgba(184, 140, 45, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(184, 140, 45, 0.5);
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="card">
      <p class="eyebrow">Celebration livestream</p>
      <h1>Join Us Online</h1>
      <p>The ceremony begins at <strong>11:15am EST</strong> on <strong>12/31/2026</strong>.</p>

      <!-- Before the link exists: -->
      <p>The livestream link will appear here shortly before the ceremony.</p>

      <!-- Later, replace the paragraph above with: -->
      <!-- <a class="button" href="https://YOUR-STREAM-LINK">Watch the livestream</a> -->

      <!-- <p>Trouble connecting? Contact [name] at [phone/email].</p> -->
    </div>
  </main>
</body>
</html>
